<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>下道ロードトリップ道中記</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E4%B8%8B%E9%81%93%E3%83%AD%E3%83%BC%E3%83%89%E3%83%88%E3%83%AA%E3%83%83%E3%83%97%E9%81%93%E4%B8%AD%E8%A8%98%22%2C%22short_name%22%3A%22%E6%A1%83%E9%89%84%E9%81%93%E4%B8%AD%E8%A8%98%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFF8E7%22%2C%22theme_color%22%3A%22%23FFC93C%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A//www.w3.org/2000/svg%2522%2520viewBox%253D%25220%25200%2520100%2520100%2522%253E%253Crect%2520width%253D%2522100%2522%2520height%253D%2522100%2522%2520rx%253D%252220%2522%2520fill%253D%2522%2523FFC93C%2522/%253E%253Crect%2520x%253D%252220%2522%2520y%253D%252220%2522%2520width%253D%252260%2522%2520height%253D%252260%2522%2520rx%253D%252210%2522%2520fill%253D%2522%2523fff%2522%2520stroke%253D%2522%25232B2320%2522%2520stroke-width%253D%25224%2522/%253E%253Ccircle%2520cx%253D%252235%2522%2520cy%253D%252235%2522%2520r%253D%25226%2522%2520fill%253D%2522%2523E63946%2522/%253E%253Ccircle%2520cx%253D%252265%2522%2520cy%253D%252265%2522%2520r%253D%25226%2522%2520fill%253D%2522%2523E63946%2522/%253E%253Ccircle%2520cx%253D%252250%2522%2520cy%253D%252250%2522%2520r%253D%25226%2522%2520fill%253D%2522%2523E63946%2522/%253E%253C/svg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image/svg%2Bxml%22%7D%5D%7D">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#FFF8E7;
    --paper:#FFFFFF;
    --ink:#2B2320;
    --ink-dim:#7A6F5E;
    --line:#EADFC5;
    --yellow:#FFC93C;
    --yellow-dark:#E8A80C;
    --red:#E63946;
    --red-dark:#B4232E;
    --blue:#4361EE;
    --blue-dark:#2E45BE;
    --green:#2A9D8F;
    --green-dark:#1E7268;
    --shadow-hard: 0 4px 0;
  }
  *{box-sizing:border-box;}
  html{ background: var(--bg); min-height:100%; }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 0%, #FFEFC2 0%, transparent 45%),
      radial-gradient(circle at 100% 20%, #FFE0C2 0%, transparent 40%),
      var(--bg);
    background-color: var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{ max-width:480px; margin:0 auto; padding:16px 14px 60px; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .app-title{ font-size:20px; font-weight:900; color:var(--red); letter-spacing:0.02em;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
  .app-sub{ font-size:11px; color:var(--ink-dim); font-weight:700; }
  .icon-btn{ background:#fff;border:2px solid var(--ink);color:var(--ink); border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer; box-shadow: var(--shadow-hard) var(--ink); }
  .icon-btn:active{ transform:translateY(3px); box-shadow:none; }

  .phase-bar{ display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:4px solid var(--ink); border-radius:14px; padding:10px 14px; margin-bottom:14px; box-shadow: 0 5px 0 var(--ink); }
  .phase-badge{ font-size:13px; font-weight:900; padding:5px 12px; border-radius:20px; color:#fff; }
  .phase-badge.moving{ background:var(--blue); }
  .phase-badge.sightseeing{ background:var(--green); }
  .phase-badge.resting{ background:#9B8B6F; }
  .rest-toggle{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; cursor:pointer; }
  .rest-toggle input{ width:36px; height:20px; }

  .pt-card{ background:linear-gradient(180deg,#fff,#FFFBF0); border:5px solid var(--ink); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow: 0 6px 0 var(--ink); text-align:center; position:relative; }
  .pt-card::before{ content:"✨"; position:absolute; top:6px; left:14px; font-size:18px; }
  .pt-card::after{ content:"✨"; position:absolute; top:6px; right:14px; font-size:18px; }
  .pt-label{ font-size:11px; font-weight:800; color:var(--ink-dim); letter-spacing:0.1em; }
  .pt-val{ font-size:38px; font-weight:900; color:var(--red); text-shadow:2px 2px 0 var(--yellow), -1px -1px 0 #fff; }

  .path-strip{ display:flex; justify-content:center; align-items:center; gap:7px; margin:2px 0 14px; }
  .path-dot{ width:9px; height:9px; border-radius:50%; background:var(--ink); opacity:0.18; }
  .path-dot.car{ width:20px; opacity:1; text-align:center; font-size:16px; }

  .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .tile-btn{ width:100%; border:4px solid var(--ink); border-radius:14px; padding:16px 10px; font-size:14px; font-weight:900; color:#fff; cursor:pointer; text-align:center; box-shadow: 0 5px 0 var(--ink); text-shadow:1px 1px 0 rgba(0,0,0,0.25); }
  .tile-btn:active{ transform:translateY(5px); box-shadow:none; }
  .tile-btn.full{ grid-column:1 / -1; }
  .tile-btn small{ display:block; font-size:10px; font-weight:700; opacity:0.9; margin-top:3px; }
  .tile-yellow{ background:linear-gradient(180deg,var(--yellow),var(--yellow-dark)); color:var(--ink); }
  .tile-blue{ background:linear-gradient(180deg,var(--blue),var(--blue-dark)); }
  .tile-red{ background:linear-gradient(180deg,var(--red),var(--red-dark)); }
  .tile-green{ background:linear-gradient(180deg,var(--green),var(--green-dark)); }
  .tile-purple{ background:linear-gradient(180deg,#9B5DE5,#7A3FC0); }
  .tile-gray{ background:linear-gradient(180deg,#8D99AE,#6B7789); }
  .tile-btn:disabled{ opacity:0.45; cursor:default; }

  .section-title{ font-size:12px; font-weight:900; color:var(--ink-dim); letter-spacing:0.08em; margin:16px 0 8px; }

  .held-card{ background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 3px 0 rgba(0,0,0,0.15); }
  .held-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .held-type{ font-size:10px; font-weight:900; padding:3px 9px; border-radius:8px; color:#fff; }
  .held-type.moving{ background:var(--blue); }
  .held-type.arrival{ background:var(--green); }
  .held-type.yellow{ background:var(--yellow-dark); }
  .held-cat{ font-size:10px; font-weight:800; color:var(--ink-dim); }
  .held-text{ font-size:14px; font-weight:700; line-height:1.5; margin-bottom:8px; }
  .held-actions{ display:flex; flex-wrap:wrap; gap:6px; }
  .held-btn{ flex:1; min-width:100px; border:none; border-radius:8px; padding:8px 6px; font-size:11px; font-weight:800; cursor:pointer; color:#fff; }
  .held-btn.done{ background:var(--green); }
  .held-btn.fail{ background:var(--red); }
  .held-btn.nocount{ background:#B0A48A; }

  .sub-btn{ width:100%; background:#fff; border:2px solid var(--ink); color:var(--ink); border-radius:12px; padding:12px; font-size:13px; font-weight:800; cursor:pointer; margin-bottom:8px; }
  .sub-btn:active{ background:#F3EEDD; }
  .sub-btn.danger{ border-color:var(--red); color:var(--red); }

  .empty-note{ font-size:12px; color:var(--ink-dim); text-align:center; padding:14px 8px; }

  /* オーバーレイ演出 */
  .overlay-backdrop{ position:fixed; inset:0; background:rgba(20,15,5,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }

  .slot-box{ background:var(--paper); border:4px solid var(--ink); border-radius:20px; padding:26px 20px; text-align:center; box-shadow:0 8px 0 var(--ink); }
  .slot-display{ font-size:44px; font-weight:900; color:var(--ink); background:#111; color:#FFD23F; border-radius:10px; padding:16px; margin-bottom:14px; font-family:monospace; letter-spacing:0.05em; }
  .slot-display.spinning{ animation:slotshake 0.08s infinite; }
  @keyframes slotshake{ 0%{transform:translateY(0);} 50%{transform:translateY(-4px);} 100%{transform:translateY(0);} }
  .slot-result-text{ font-size:15px; font-weight:800; line-height:1.6; margin:10px 0; }
  .slot-pt{ font-size:26px; font-weight:900; margin:6px 0; }
  .slot-pt.plus{ color:var(--green-dark); }
  .slot-pt.minus{ color:var(--red-dark); }

  .card-flip-stage{ perspective:1000px; margin-bottom:16px; }
  .card-choice-title{ color:#fff; text-align:center; font-weight:900; font-size:15px; margin-bottom:12px; text-shadow:1px 1px 0 #000; }
  .card-choice-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .mini-card-back{ aspect-ratio:2/3; background:linear-gradient(135deg,var(--yellow),var(--red)); border:3px solid #fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.35); }
  .mini-card-back:active{ transform:translateY(3px); box-shadow:none; }
  .card-flip-inner{ position:relative; width:100%; height:180px; transition:transform 0.6s; transform-style:preserve-3d; }
  .card-flip-inner.flipped{ transform:rotateY(180deg); }
  .card-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; border:4px solid var(--ink); display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; }
  .card-front{ background:linear-gradient(135deg,var(--yellow),var(--red)); }
  .card-front-mark{ font-size:48px; }
  .card-back{ background:#fff; transform:rotateY(180deg); flex-direction:column; }
  .card-back .cat-badge{ font-size:11px; font-weight:900; padding:4px 10px; border-radius:8px; color:#fff; margin-bottom:8px; }
  .card-back .card-text{ font-size:15px; font-weight:800; line-height:1.6; margin-bottom:8px; }
  .card-back .card-pt{ font-size:24px; font-weight:900; color:var(--red-dark); }

  .legendary-flash{ animation:flashbg 0.5s ease-in-out 3; }
  @keyframes flashbg{ 0%,100%{ background:var(--paper);} 50%{ background:#FFF3B0;} }
  .confetti-note{ font-size:24px; text-align:center; margin-top:6px; }

  .overlay-sheet{ width:100%; max-width:420px; position:relative; }
  .orbit-container{ position:absolute; top:50%; left:50%; width:230px; height:230px; margin:-115px 0 0 -115px; pointer-events:none; z-index:5; }
  .orbit-ring{ position:absolute; inset:0; animation: orbitspin 3.5s linear infinite; }
  .orbit-item{ position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px; font-size:30px; text-align:center; line-height:34px; }
  @keyframes orbitspin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  .dice-box{ background:var(--paper); border:4px solid var(--ink); border-radius:20px; padding:30px; text-align:center; box-shadow:0 8px 0 var(--ink); }
  .dice-face{ font-size:80px; }
  .dice-face.rolling{ animation:diceroll 0.1s infinite; }
  @keyframes diceroll{ 0%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.1);} 100%{transform:rotate(360deg) scale(1);} }

  #miniMap{ width:100%; height:160px; border-radius:14px; border:2px solid var(--ink); margin-bottom:10px; }
  #pinMap{ width:100%; height:60vh; min-height:320px; border-radius:14px; border:2px solid var(--ink); margin-bottom:10px; }
  #resultMap{ width:100%; height:260px; border-radius:14px; border:2px solid var(--ink); margin-bottom:10px; }
  #resultMap2{ width:100%; height:220px; border-radius:14px; border:2px solid var(--ink); margin-bottom:10px; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,15,5,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:1000; }
  .modal{ background:var(--paper); border:3px solid var(--ink); border-radius:20px 20px 0 0; padding:20px 16px 26px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 12px; font-size:16px; color:var(--ink); }
  .modal p{ font-size:12px; color:var(--ink-dim); margin:0 0 10px; line-height:1.6; }
  .modal input[type=text],.modal input[type=number],.modal input[type=datetime-local]{ width:100%; padding:12px; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); font-size:15px; margin-bottom:10px; }
  .modal textarea{ width:100%; resize:vertical; border-radius:10px; border:2px solid var(--line); padding:10px; font-family:monospace; font-size:11px; background:#fff; color:var(--ink); margin-bottom:10px; }
  .divider{ border:none; border-top:2px dashed var(--line); margin:14px 0; }

  .history-item{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:12px; gap:8px; }
  .history-item:last-child{ border-bottom:none; }
  .history-name{ font-weight:800; }
  .history-sub{ font-size:10px; color:var(--ink-dim); }

  .share-toast{ text-align:center; font-size:12px; color:var(--red-dark); font-weight:800; margin:6px 0; }
  .debug-note{ font-size:10px; color:var(--ink-dim); margin-top:6px; text-align:center; }
  @keyframes slideDownIn{ from{ opacity:0; transform:translateY(-18px);} to{ opacity:1; transform:translateY(0);} }
  .flow-item{ animation: slideDownIn 0.45s ease-out both; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
/* ===================== 定数 ===================== */
const STORAGE_KEY = "trip-state-v2";
const TOKYO = { lat:35.681236, lng:139.767125 };

const MISSION_TYPE_META = {
  moving:{label:"移動中ミッション", color:"#4361EE", anim:"slot"},
  arrival:{label:"到着地ミッション", color:"#2A9D8F", anim:"card"},
  yellow:{label:"黄色マスミッション", color:"#E8A80C", anim:"card"}
};
const DEFAULT_POINT_RANGES = {
  moving: {min:100, max:600},
  arrival: {min:500, max:3000},
  yellow: {min:500, max:5000}
};
function pointRangeFor(missionType){
  return (state && state.settings && state.settings.pointRanges && state.settings.pointRanges[missionType]) || DEFAULT_POINT_RANGES[missionType];
}

const EXPENSE_CATEGORIES = ["食費","ガソリン代","お土産","車中泊用品","観光・体験","その他"];

/* ===================== 実績データ ===================== */
const ACHIEVEMENTS = [
  {id:"first_step", name:"はじめの一歩", desc:"はじめて目的地を設定した", secret:false, reward:200,
    check: s => s.pins.some(p=>p.type==="destination")},
  {id:"first_arrival", name:"到着!", desc:"はじめて到着ボーナスを獲得した", secret:false, reward:300,
    check: s => s.pointLog.some(l=>l.kind==="arrivalBonus")},
  {id:"mission_10", name:"ミッションマスター", desc:"ミッションを10回達成した", secret:false, reward:500,
    check: s => s.pointLog.filter(l=>l.kind.startsWith("mission-")&&l.amount>0).length>=10},
  {id:"mission_30", name:"ミッション王", desc:"ミッションを30回達成した", secret:false, reward:1500,
    check: s => s.pointLog.filter(l=>l.kind.startsWith("mission-")&&l.amount>0).length>=30},
  {id:"yellow_5", name:"黄色マス制覇", desc:"黄色マスミッションを5回達成した", secret:false, reward:800,
    check: s => s.pointLog.filter(l=>l.kind==="mission-yellow"&&l.amount>0).length>=5},
  {id:"arrival_mission_10", name:"到着地ハンター", desc:"到着地ミッションを10回達成した", secret:false, reward:600,
    check: s => s.pointLog.filter(l=>l.kind==="mission-arrival"&&l.amount>0).length>=10},
  {id:"moving_mission_15", name:"移動中皆勤賞", desc:"移動中ミッションを15回達成した", secret:false, reward:700,
    check: s => s.pointLog.filter(l=>l.kind==="mission-moving"&&l.amount>0).length>=15},
  {id:"rich_20000", name:"大金持ち", desc:"所持ポイントが15,000ptを超えた", secret:false, reward:400,
    check: s => s.pt>=15000},
  {id:"debt_hell", name:"借金地獄", desc:"???", secret:true, reward:100,
    check: s => s.pt<=-3000},
  {id:"big_spender", name:"浪費家", desc:"累計支出が10,000円を超えた", secret:false, reward:300,
    check: s => -(s.pointLog.filter(l=>l.kind==="spend").reduce((a,l)=>a+l.amount,0)) >= 10000},
  {id:"angel_blessed", name:"エンジェルに愛される者", desc:"???", secret:true, reward:800,
    check: s => s.pointLog.some(l=>l.kind==="blue" && l.amount===Math.max(...s.settings.blueTable.map(x=>x.pt)))},
  {id:"devil_marked", name:"デビルに魅入られし者", desc:"???", secret:true, reward:300,
    check: s => s.pointLog.some(l=>l.kind==="red" && l.amount===-Math.max(...s.settings.redTable.map(x=>x.pt)))},
  {id:"arrival_5", name:"5箇所到達", desc:"到着地を5箇所記録した", secret:false, reward:600,
    check: s => s.pins.filter(p=>p.type==="arrival").length>=5},
  {id:"arrival_10", name:"10箇所到達", desc:"到着地を10箇所記録した", secret:false, reward:1200,
    check: s => s.pins.filter(p=>p.type==="arrival").length>=10},
  {id:"arrival_20", name:"20箇所到達", desc:"到着地を20箇所記録した", secret:false, reward:2000,
    check: s => s.pins.filter(p=>p.type==="arrival").length>=20},
  {id:"rain_warrior", name:"雨天決行", desc:"???", secret:true, reward:500,
    check: s => s.pointLog.some(l=>l.kind.startsWith("mission-")&&l.amount>0&&l.weatherBad)},
  {id:"perfect_failure", name:"完璧な失敗", desc:"ミッションを5回逃した", secret:false, reward:200,
    check: s => s.pointLog.filter(l=>l.kind.startsWith("mission-")&&l.amount<0).length>=5},
  {id:"jackpot", name:"一撃必殺", desc:"???", secret:true, reward:800,
    check: s => s.pointLog.some(l=>l.kind.startsWith("mission-")&&l.amount>=2700)},
  {id:"custom_start", name:"旅立ちのカスタマイズ", desc:"出発地点を東京駅以外に変更した", secret:false, reward:200,
    check: s => s.settings.startLocation && s.settings.startLocation.name !== "東京駅"},
  {id:"moving_master", name:"移動職人", desc:"移動中ミッションを50回達成した", secret:false, reward:800,
    check: s => s.pointLog.filter(l=>l.kind==="mission-moving"&&l.amount>0).length>=50},
  {id:"yellow_10", name:"黄金の道", desc:"黄色マスミッションを10回達成した", secret:false, reward:1000,
    check: s => s.pointLog.filter(l=>l.kind==="mission-yellow"&&l.amount>0).length>=10},
  {id:"yellow_20", name:"黄色マス皆伝", desc:"黄色マスミッションを20回達成した", secret:false, reward:2000,
    check: s => s.pointLog.filter(l=>l.kind==="mission-yellow"&&l.amount>0).length>=20},
  {id:"variety_master", name:"多趣味な旅人", desc:"3種類のミッション(移動中/到着地/黄色マス)すべてで5回以上達成した", secret:false, reward:700,
    check: s => ["mission-moving","mission-arrival","mission-yellow"].every(k=> s.pointLog.filter(l=>l.kind===k&&l.amount>0).length>=5)},

function checkAchievements(){
  const newly = [];
  for(const ach of ACHIEVEMENTS){
    if(state.unlockedAchievements.includes(ach.id)) continue;
    let met = false;
    try{ met = !!ach.check(state); }catch(e){ met = false; }
    if(met){
      state.unlockedAchievements.push(ach.id);
      state.pt += ach.reward;
      state.pointLog.push({ id:"log"+Date.now()+Math.random().toString(36).slice(2,5), timestamp:nowISO(), kind:"achievement", amount:ach.reward, note:"実績解除: "+ach.name });
      newly.push(ach);
    }
  }
  if(newly.length){
    saveState();
    ui.newAchievements = (ui.newAchievements||[]).concat(newly);
  }
  return newly;
}

/* ===================== ストレージ互換レイヤー(旧実装から流用) ===================== */
const STORAGE_MODE = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") ? "native" : "local";
async function storageGet(key){
  if(STORAGE_MODE === "native"){
    try{ const r = await window.storage.get(key, false); if(r && r.value) return r.value; }catch(e){}
    try{ const local = localStorage.getItem(key); if(local) return local; }catch(e){}
    return null;
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ console.error("local backup write failed", e); }
  if(STORAGE_MODE === "native"){
    try{ await window.storage.set(key, value, false); }catch(e){ console.error("native storage set failed", e); }
  }
}
async function storageDelete(key){
  try{ localStorage.removeItem(key); }catch(e){}
  if(STORAGE_MODE === "native"){
    try{ await window.storage.delete(key, false); }catch(e){}
  }
}

function esc(s){ const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickWeighted(table){
  if(!table || table.length===0) return 0;
  const total = table.reduce((s,x)=>s+x.w,0);
  if(total<=0) return table[0].pt;
  let r = Math.random()*total;
  for(const x of table){ if(r<x.w) return x.pt; r -= x.w; }
  return table[table.length-1].pt;
}
function nowISO(){ return new Date().toISOString(); }
function fmtDateTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function minutesSince(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 60000;
}

/* ===================== CSV⇄ミッション変換(3種共通ロジック) ===================== */
function stripCsvQuotes(field){
  let f = (field||"").trim();
  if(f.length>=2 && f.startsWith('"') && f.endsWith('"')){
    f = f.slice(1,-1).replace(/""/g,'"');
  }
  return f;
}
function validateMissionsShape(list){
  if(!Array.isArray(list) || list.length===0) return false;
  return list.every(m => m && typeof m.number==="number" && typeof m.text==="string" && m.text.length>0 && typeof m.points==="number" && (m.repeat===0 || m.repeat===1));
}
function csvField(val){
  const s = String(val);
  if(s.includes(",") || s.includes('"') || s.includes("\n")){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}
function missionsToCSV(missionsList){
  const lines = ["number,text,points,repeat"];
  for(const m of missionsList){
    lines.push(`${m.number},${csvField(m.text)},${m.points},${m.repeat}`);
  }
  return lines.join("\n");
}
function parseMissionsCSV(text){
  const lines = text.split("\n").map(l=>l.replace(/\r$/,"")).filter(l=>l.trim().length>0);
  const result = [];
  let autoNumber = 1;
  for(const line of lines){
    const parts = [];
    let cur = "", inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"') inQuotes = !inQuotes;
      else if(ch===',' && !inQuotes){ parts.push(cur); cur=""; }
      else cur += ch;
    }
    parts.push(cur);
    if(parts.length < 2) continue;
    let numberVal, textVal, pointsVal, repeatVal;
    if(parts.length >= 4){
      const maybeNum = stripCsvQuotes(parts[0]);
      if(/^-?\d+$/.test(maybeNum)){
        numberVal = parseInt(maybeNum,10);
        textVal = stripCsvQuotes(parts[1]);
        pointsVal = parseInt(stripCsvQuotes(parts[2]),10);
        repeatVal = stripCsvQuotes(parts[3]).trim()==="1" ? 1 : 0;
      } else { continue; }
    } else {
      // 旧形式や簡易2列にも一応対応し、自動採番・リピート0で救済する
      // ただしpoints列が数値でない場合(ヘッダー行等)は誤取り込みを避けるためスキップする
      textVal = stripCsvQuotes(parts[parts.length-2] || parts[0]);
      const maybePoints = stripCsvQuotes(parts[parts.length-1]);
      if(!/^-?\d+$/.test(maybePoints)) continue;
      pointsVal = parseInt(maybePoints,10);
      numberVal = autoNumber++;
      repeatVal = 0;
    }
    if(!textVal || isNaN(numberVal) || isNaN(pointsVal)) continue;
    result.push({number:numberVal, text:textVal, points:pointsVal, repeat:repeatVal});
  }
  return result;
}
function parseMissionInput(raw){
  const trimmed = raw.trim();
  if(trimmed.startsWith("[")){
    try{ const parsed = JSON.parse(trimmed); if(validateMissionsShape(parsed)) return parsed; }catch(e){}
    return null;
  }
  const csvResult = parseMissionsCSV(trimmed);
  return validateMissionsShape(csvResult) ? csvResult : null;
}
const MISSIONS_OVERRIDE_KEYS = { moving:"custom-missions-moving", arrival:"custom-missions-arrival", yellow:"custom-missions-yellow" };
function syncPointRangeToPool(missionType){
  const pool = missionsForType(missionType);
  if(!pool || !pool.length || !state || !state.settings) return;
  const pts = pool.map(m=>m.points);
  state.settings.pointRanges[missionType] = { min: Math.min(...pts), max: Math.max(...pts) };
}
async function loadMissionsOverride(missionType){
  try{
    const val = await storageGet(MISSIONS_OVERRIDE_KEYS[missionType]);
    if(val){
      const parsed = JSON.parse(val);
      if(validateMissionsShape(parsed)){
        if(missionType==="moving") ACTIVE_MISSIONS_MOVING = parsed;
        else if(missionType==="arrival") ACTIVE_MISSIONS_ARRIVAL = parsed;
        else ACTIVE_MISSIONS_YELLOW = parsed;
        syncPointRangeToPool(missionType);
      }
    }
  }catch(e){}
}
async function loadAllMissionsOverrides(){
  await loadMissionsOverride("moving");
  await loadMissionsOverride("arrival");
  await loadMissionsOverride("yellow");
}

function migrateState(){
  if(!state) return;
  if(!Array.isArray(state.pointLog)){
    // 旧バージョンの互換性がないデータ、または初回。安全のため新規状態にリセット
    state = defaultState();
    return;
  }
  if(!state.settings) state.settings = defaultState().settings;
  if(typeof state.isResting !== "boolean") state.isResting = false;
  if(!Array.isArray(state.pins)) state.pins = [];
  if(!Array.isArray(state.heldMissions)) state.heldMissions = [];
  if(state.activeDestination === undefined) state.activeDestination = null;
  if(!state.settings.blueTable || !state.settings.blueTable.length) state.settings.blueTable = defaultState().settings.blueTable;
  if(!state.settings.redTable || !state.settings.redTable.length) state.settings.redTable = defaultState().settings.redTable;
  if(typeof state.diceRollCount !== "number") state.diceRollCount = 0;
  if(!Array.isArray(state.diceHistory)) state.diceHistory = [];
  if(typeof state.hasExported !== "boolean") state.hasExported = false;
  if(!Array.isArray(state.unlockedAchievements)) state.unlockedAchievements = [];
  if(typeof state.settings.autoBackupOnArrival !== "boolean") state.settings.autoBackupOnArrival = false;
  if(!state.settings.pointRanges) state.settings.pointRanges = JSON.parse(JSON.stringify(DEFAULT_POINT_RANGES));
  if(!state.settings.startLocation || typeof state.settings.startLocation.lat !== "number"){
    state.settings.startLocation = { name:"東京駅", lat: TOKYO.lat, lng: TOKYO.lng };
  }
  if(!state.drawnMissionNumbers) state.drawnMissionNumbers = { moving: [], arrival: [], yellow: [] };
  ["moving","arrival","yellow"].forEach(t=>{ if(!Array.isArray(state.drawnMissionNumbers[t])) state.drawnMissionNumbers[t] = []; });
  // 旧バージョン(カテゴリ形式)のheldMissionsにnumberが無い場合の救済(表示崩れ防止)
  state.heldMissions.forEach(m=>{ if(typeof m.number !== "number") m.number = 0; });
}
async function loadState(){
  try{
    const val = await storageGet(STORAGE_KEY);
    state = val ? JSON.parse(val) : defaultState();
  }catch(e){
    state = defaultState();
  }
  migrateState();
  await loadAllMissionsOverrides();
  const weatherLoc = state.activeDestination
    ? state.activeDestination
    : [...state.pins].filter(p=>p.type==="arrival").sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp))[0];
  if(weatherLoc && typeof weatherLoc.lat === "number") fetchWeather(weatherLoc.lat, weatherLoc.lng);
  render();
  checkMovingMissionOnResume();
}
async function saveState(){
  await storageSet(STORAGE_KEY, JSON.stringify(state));
}
async function doResetTrip(){
  await storageDelete(STORAGE_KEY);
  state = defaultState();
  ui = defaultUI();
  await storageSet(STORAGE_KEY, JSON.stringify(state));
  render();
}

/* ===================== 天気連動 ===================== */
async function fetchWeather(lat, lng){
  if(typeof lat !== "number" || typeof lng !== "number") return;
  try{
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
    const data = await res.json();
    const code = data.current_weather.weathercode;
    const temp = data.current_weather.temperature;
    const rainCodes=[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99];
    const snowCodes=[71,73,75,77,85,86];
    const isBad = rainCodes.includes(code) || snowCodes.includes(code);
    let icon="☀️";
    if(snowCodes.includes(code)) icon="❄️";
    else if(rainCodes.includes(code)) icon="🌧️";
    else if([1,2,3].includes(code)) icon="☁️";
    ui.weather = { code, temp, isBad, icon };
  }catch(e){
    ui.weather = null;
  }
  render();
}
const REPEAT_WEIGHT_MULTIPLIER = 3;
function weightedPickMission(list){
  if(!list || list.length===0) return null;
  const weights = list.map(m => m.repeat===1 ? REPEAT_WEIGHT_MULTIPLIER : 1);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<list.length;i++){
    if(r < weights[i]) return list[i];
    r -= weights[i];
  }
  return list[list.length-1];
}
function getEligibleMissions(missionType){
  const pool = missionsForType(missionType);
  const list = (pool && pool.length) ? pool : defaultMissionsForType(missionType);
  const drawnNumbers = (state.drawnMissionNumbers && state.drawnMissionNumbers[missionType]) || [];
  const heldTexts = state.heldMissions.map(m=>m.text);
  let candidates = list.filter(m => (m.repeat===1 || !drawnNumbers.includes(m.number)) && !heldTexts.includes(m.text));
  if(candidates.length===0){
    // リピート不可のものが尽きた場合の安全策:全件から選び直す(held中のものは除く)
    candidates = list.filter(m => !heldTexts.includes(m.text));
  }
  if(candidates.length===0) candidates = list;
  return { list, candidates };
}
function drawMission(missionType){
  const { candidates } = getEligibleMissions(missionType);
  const picked = weightedPickMission(candidates) || defaultMissionsForType(missionType)[0];
  if(!state.drawnMissionNumbers) state.drawnMissionNumbers = {moving:[],arrival:[],yellow:[]};
  if(!state.drawnMissionNumbers[missionType].includes(picked.number)){
    state.drawnMissionNumbers[missionType].push(picked.number);
  }
  const mission = { id:"m"+Date.now()+Math.random().toString(36).slice(2,7), missionType, number:picked.number, text:picked.text, points:picked.points, drawnAt: nowISO() };
  state.heldMissions.push(mission);
  saveState();
  return mission;
}
function pickCandidateMission(missionType){
  const { candidates } = getEligibleMissions(missionType);
  const picked = weightedPickMission(candidates) || defaultMissionsForType(missionType)[0];
  return { number:picked.number, text:picked.text, points:picked.points };
}

let lastStateSnapshot = null;
function snapshotState(){
  lastStateSnapshot = JSON.parse(JSON.stringify(state));
}
function undoLastAction(){
  if(!lastStateSnapshot){
    ui.shareMessage = "取り消せる操作がありません";
    render();
    setTimeout(()=>{ ui.shareMessage=null; render(); }, 2000);
    return;
  }
  state = lastStateSnapshot;
  lastStateSnapshot = null;
  saveState();
  ui.overlay = null;
  ui.shareMessage = "直前の操作を取り消しました";
  render();

function resolveMission(id, outcome){
  const idx = state.heldMissions.findIndex(m=>m.id===id);
  if(idx===-1) return;
  snapshotState();
  const m = state.heldMissions[idx];
  let ptChange = 0;
  if(outcome==="done") ptChange = m.points;
  if(outcome==="failed") ptChange = -Math.round(m.points/2);
  state.pt += ptChange;
  if(outcome!=="nocount"){
    state.pointLog.push({ id:"log"+Date.now()+Math.random().toString(36).slice(2,5), timestamp:nowISO(), kind:"mission-"+m.missionType, amount:ptChange, note:m.text, missionNumber:m.number, weatherBad: !!(ui.weather && ui.weather.isBad) });
  }
  state.heldMissions.splice(idx,1);
  saveState();
  checkAchievements();
  render();
}

function pairPinsIntoLegs(sortedPins){
  const legs = [];
  let pendingDest = null;
  for(const p of sortedPins){
    if(p.type === "destination"){
      if(pendingDest) legs.push({dest:pendingDest, arrival:null});
      pendingDest = p;
    } else if(p.type === "arrival"){
      legs.push({dest:pendingDest, arrival:p});
      pendingDest = null;
    }
  }
  if(pendingDest) legs.push({dest:pendingDest, arrival:null});
  return legs;
}

function rescaleMissionPool(missionType, newMin, newMax){
  const pool = missionsForType(missionType);
  if(!pool.length) return pool;
  const allPoints = pool.map(m=>m.points);
  const oldMin = Math.min(...allPoints);
  const oldMax = Math.max(...allPoints);
  return pool.map(m=>{
    let newPt;
    if(oldMax === oldMin){ newPt = newMin; }
    else{
      const ratio = (m.points - oldMin) / (oldMax - oldMin);
      newPt = Math.round((newMin + ratio*(newMax-newMin))/5)*5;
    }
    return { number:m.number, text:m.text, points:newPt, repeat:m.repeat };
  });
}
async function applyPointRanges(){
  const types = ["moving","arrival","yellow"];
  const changed = [];
  for(const t of types){
    const minEl = document.getElementById(t+"MinInput");
    const maxEl = document.getElementById(t+"MaxInput");
    const min = parseInt(minEl.value,10);
    const max = parseInt(maxEl.value,10);
    if(isNaN(min) || isNaN(max) || max<=min) continue;
    const oldRange = pointRangeFor(t);
    if(oldRange.min===min && oldRange.max===max) continue;
    const rescaled = rescaleMissionPool(t, min, max);
    if(t==="moving") ACTIVE_MISSIONS_MOVING = rescaled;
    else if(t==="arrival") ACTIVE_MISSIONS_ARRIVAL = rescaled;
    else ACTIVE_MISSIONS_YELLOW = rescaled;
    await storageSet(MISSIONS_OVERRIDE_KEYS[t], JSON.stringify(rescaled));
    state.settings.pointRanges[t] = {min, max};
    changed.push(t);
  }
  await saveState();
  ui.shareMessage = changed.length ? `${changed.length}種類のポイントレンジを更新し、ミッションを再スケールしました` : "変更はありませんでした";
  render();
  setTimeout(()=>{ ui.shareMessage=null; render(); }, 3000);
}

function openStats(){ ui.screen = "stats"; render(); }
function renderStatsScreen(){
  const missionLogs = state.pointLog.filter(l=>l.kind.startsWith("mission-"));
  const doneMissions = missionLogs.filter(l=>l.amount>0);
  const failedMissions = missionLogs.filter(l=>l.amount<0);
  const totalDrawn = doneMissions.length + failedMissions.length;
  const completionRate = totalDrawn>0 ? Math.round(doneMissions.length/totalDrawn*100) : 0;
  const byType = {moving:0, arrival:0, yellow:0};
  doneMissions.forEach(l=>{ const t=l.kind.replace("mission-",""); if(byType[t]!==undefined) byType[t]++; });
  const spendLogs = state.pointLog.filter(l=>l.kind==="spend");
  const totalSpend = -spendLogs.reduce((a,l)=>a+l.amount,0);
  const byCategory = {};
  spendLogs.forEach(l=>{ const c=l.category||"その他"; byCategory[c]=(byCategory[c]||0)+(-l.amount); });
  const blueLogs = state.pointLog.filter(l=>l.kind==="blue");
  const redLogs = state.pointLog.filter(l=>l.kind==="red");
  const categoryRows = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>
    `<div class="history-item"><div class="history-name">${esc(cat)}</div><div style="font-weight:900;">${amt.toLocaleString()}円</div></div>`
  ).join("") || `<div class="empty-note">支出記録なし</div>`;
  return `
    ${renderHeader()}
    <button class="sub-btn" onclick="ui.screen='home'; render();">← ホームに戻る</button>
    <div class="pt-card"><div class="pt-label">現在の軍資金</div><div class="pt-val">${state.pt.toLocaleString()}pt</div></div>
    <div class="section-title">ミッション達成率</div>
    <div class="pt-card" style="text-align:center;">
      <div class="pt-val" style="font-size:32px;">${completionRate}%</div>
      <div style="font-size:12px;color:var(--ink-dim);">達成${doneMissions.length}件 / 失敗${failedMissions.length}件</div>
    </div>
    <div class="history-item"><div class="history-name">🚗 移動中ミッション達成</div><div>${byType.moving}件</div></div>
    <div class="history-item"><div class="history-name">🏝 到着地ミッション達成</div><div>${byType.arrival}件</div></div>
    <div class="history-item"><div class="history-name">🌟 黄色マスミッション達成</div><div>${byType.yellow}件</div></div>
    <div class="section-title">マス目イベント</div>
    <div class="history-item"><div class="history-name">🟦 青マス</div><div>${blueLogs.length}回</div></div>
    <div class="history-item"><div class="history-name">🟥 赤マス</div><div>${redLogs.length}回</div></div>
    <div class="section-title">支出(合計 ${totalSpend.toLocaleString()}円)</div>
    ${categoryRows}
    <div class="section-title">その他</div>
    <div class="history-item"><div class="history-name">📍 到着地数</div><div>${state.pins.filter(p=>p.type==="arrival").length}箇所</div></div>
    <div class="history-item"><div class="history-name">🎲 サイコロ回数</div><div>${state.diceRollCount||0}回</div></div>
    <div class="history-item"><div class="history-name">🏅 実績解除数</div><div>${state.unlockedAchievements.length} / ${ACHIEVEMENTS.length}</div></div>
  `;
}

function buildResultsSummaryText(){
  const sortedPins = [...state.pins].sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));
  const allLogs = [...state.pointLog].sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));
  const doneMissions = allLogs.filter(l=>l.kind.startsWith("mission-") && l.amount>0);
  const spendLogs = allLogs.filter(l=>l.kind==="spend");
  const unlockedAch = ACHIEVEMENTS.filter(a=>state.unlockedAchievements.includes(a.id));
  let text = "🎲 下道ロードトリップ道中記 旅の記録(詳細版)\n";
  text += "================================\n";
  text += `最終所持ポイント: ${state.pt.toLocaleString()}pt\n\n`;
  text += "【到着地ログ】\n";
  text += sortedPins.length ? sortedPins.map(p=>`${p.type==="destination"?"📍":"✅"} ${p.name}(${fmtDateTime(p.timestamp)})`).join("\n") : "(記録なし)";
  text += "\n\n【達成ミッション】\n";
  text += doneMissions.length ? doneMissions.map(l=>`🏆 ${l.note}(+${l.amount}pt)`).join("\n") : "(記録なし)";
  text += "\n\n【支出記録】\n";
  text += spendLogs.length ? spendLogs.map(l=>`💴 ${l.category||"その他"} - ${l.note}: ${(-l.amount).toLocaleString()}円(${fmtDateTime(l.timestamp)})`).join("\n") : "(記録なし)";
  text += "\n\n【獲得した実績】\n";
  text += unlockedAch.length ? unlockedAch.map(a=>`🏅 ${a.name}(+${a.reward}pt)`).join("\n") : "(記録なし)";
  text += "\n\n【ポイント増減ログ(全件)】\n";
  text += allLogs.length ? allLogs.map(l=>{
    const label = l.kind.startsWith("mission-") ? l.note : (logKindLabel(l.kind) + (l.note?" - "+l.note:""));
    return `${fmtDateTime(l.timestamp)} ${label} ${l.amount>=0?"+":""}${l.amount}pt`;
  }).join("\n") : "(記録なし)";
  return text;
}
async function shareResultsText(){

  }

}
async function downloadResultsText(){

    const blob = new Blob([text], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "roadtrip-results-" + Date.now() + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);

  }catch(e){

}

/* ===================== ゲーム風リザルト画像エクスポート ===================== */
async function downloadResultImage(){
  try{
    const sortedPins = [...state.pins].sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp));
    const doneMissions = state.pointLog.filter(l=>l.kind.startsWith("mission-") && l.amount>0);
    const W=900, H=1400;
    const canvas = document.createElement("canvas");
    canvas.width=W; canvas.height=H;
    const ctx = canvas.getContext("2d");
    // 背景
    ctx.fillStyle="#FFF8E7"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#2B2320"; ctx.lineWidth=10; ctx.strokeRect(15,15,W-30,H-30);
    // タイトル
    ctx.textAlign="center";
    ctx.fillStyle="#E63946";
    ctx.font="900 54px sans-serif";
    ctx.fillText("旅の記録", W/2, 110);
    ctx.font="700 22px sans-serif";
    ctx.fillStyle="#7A6F5E";
    ctx.fillText("下道ロードトリップ道中記", W/2, 150);
    // pt表示
    ctx.fillStyle="#FFC93C";
    ctx.fillRect(W/2-260,190,520,140);
    ctx.strokeStyle="#2B2320"; ctx.lineWidth=6; ctx.strokeRect(W/2-260,190,520,140);
    ctx.fillStyle="#2B2320";
    ctx.font="900 64px sans-serif";
    ctx.fillText(state.pt.toLocaleString()+" pt", W/2, 280);
    // 経路(すごろく風パス、地点ごとに設定時刻→到着時刻を併記)
    let y = 400;
    ctx.textAlign="left";
    ctx.fillStyle="#2B2320";
    ctx.font="900 26px sans-serif";
    ctx.fillText("🗺️ 旅の経路", 60, y);
    y+=15;
    const legs = pairPinsIntoLegs(sortedPins);
    const waypoints = sortedPins.filter(p=>p.type==="waypoint");
    const items = [];
    legs.forEach(leg=>{
      if(leg.dest && leg.arrival){
        // 設定〜到着の間に挟まる寄り道を探し、レグを分割して正しい順序で挿入する
        const destTime = new Date(leg.dest.timestamp);
        const arrTime = new Date(leg.arrival.timestamp);
        const between = waypoints.filter(w=>{
          const wt = new Date(w.timestamp);
          return wt >= destTime && wt <= arrTime;
        });
        items.push({ name: leg.dest.name, timeLabel: `設定 ${fmtDateTime(leg.dest.timestamp)}`, sortTime: leg.dest.timestamp });
        between.forEach(w=>{
          items.push({ name: "🟣"+w.name, timeLabel: `寄り道 ${fmtDateTime(w.timestamp)}`, sortTime: w.timestamp });
        });
        items.push({ name: leg.arrival.name+"(到着)", timeLabel: `到着 ${fmtDateTime(leg.arrival.timestamp)}`, sortTime: leg.arrival.timestamp });
      } else if(leg.dest){
        items.push({ name: leg.dest.name, timeLabel: `設定 ${fmtDateTime(leg.dest.timestamp)}(未到着)`, sortTime: leg.dest.timestamp });
      } else if(leg.arrival){
        items.push({ name: leg.arrival.name, timeLabel: `到着 ${fmtDateTime(leg.arrival.timestamp)}`, sortTime: leg.arrival.timestamp });
      }
    });
    // どのレグの区間にも属さない寄り道(目的地未設定時や最後の到着後等)を末尾に追加
    const usedWaypointTimes = new Set();
    legs.forEach(leg=>{
      if(leg.dest && leg.arrival){
        waypoints.forEach(w=>{
          const wt = new Date(w.timestamp);
          if(wt >= new Date(leg.dest.timestamp) && wt <= new Date(leg.arrival.timestamp)) usedWaypointTimes.add(w.id);
        });
      }
    });
    waypoints.filter(w=>!usedWaypointTimes.has(w.id)).forEach(w=>{
      items.push({ name: "🟣"+w.name, timeLabel: `寄り道 ${fmtDateTime(w.timestamp)}`, sortTime: w.timestamp });
    });
    const mergedItems = items.sort((a,b)=> new Date(a.sortTime||0) - new Date(b.sortTime||0));
    const routeItems = [{name: state.settings.startLocation.name+"(スタート)", timeLabel:"出発"}].concat(mergedItems);
    const colors=["#FFC93C","#4361EE","#2A9D8F","#E63946","#9B5DE5"];
    routeItems.slice(0,10).forEach((p,i)=>{
      y+=64;
      ctx.fillStyle = colors[i%colors.length];
      ctx.beginPath(); ctx.arc(80,y-16,14,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#2B2320"; ctx.lineWidth=3; ctx.stroke();
      if(i>0){
        ctx.beginPath(); ctx.moveTo(80,y-16-60); ctx.lineTo(80,y-16-14); ctx.strokeStyle="#2B2320"; ctx.lineWidth=3; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle="#2B2320";
      ctx.font="700 24px sans-serif";
      ctx.fillText((p.name||"").slice(0,20), 110, y-18);
      ctx.font="500 17px sans-serif";
      ctx.fillStyle="#7A6F5E";
      ctx.fillText(p.timeLabel, 110, y+6);
    });
    y+=54;
    // 統計サマリー
    ctx.fillStyle="#2B2320";
    ctx.font="900 26px sans-serif";
    ctx.fillText("📊 サマリー", 60, y);
    y+=44;
    ctx.font="700 22px sans-serif";
    const stats = [
      `到着地: ${sortedPins.filter(p=>p.type==="arrival").length}箇所`,
      `達成ミッション: ${doneMissions.length}件`,
      `実績解除: ${state.unlockedAchievements.length} / ${ACHIEVEMENTS.length}`,
      `サイコロ: ${state.diceRollCount||0}回`
    ];
    stats.forEach(s=>{ ctx.fillText(s, 60, y); y+=36; });

    const blob = await new Promise(res=>canvas.toBlob(res, "image/png"));
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "roadtrip-result-card-"+Date.now()+".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    ui.shareMessage = "画像をダウンロードしました";
    state.hasExported = true;
    await saveState();
    checkAchievements();
  }catch(e){
    ui.shareMessage = "画像の生成に失敗しました";
  }
  render();
  setTimeout(()=>{ ui.shareMessage=null; render(); }, 2500);
}

}

function renderOrbitEmojis(emoji, count){
  const radius = 78;
  let items = "";
  for(let i=0;i<count;i++){
    const angle = Math.round((360/count)*i);
    items += `<span class="orbit-item" style="transform:rotate(${angle}deg) translate(${radius}px) rotate(${-angle}deg);">${emoji}</span>`;
  }
  return `<div class="orbit-container"><div class="orbit-ring">${items}</div></div>`;
}
